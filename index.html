<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống quản lý học sinh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Thêm thư viện XLSX để xuất file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Thư viện biểu đồ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modalContainer" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Xác nhận</h3>
                <button id="modalClose" class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modalCancel" class="btn btn-secondary">Hủy</button>
                <button id="modalConfirm" class="btn btn-primary">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-user-graduate"></i>
            </div>
            <h2 class="login-title">Đăng nhập hệ thống</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email / Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div style="position: relative;">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <div class="flex-between" style="margin: 0.5rem 0;">
                    <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem;">
                        <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
                    </label>
                    <a href="#" id="forgotPassword" style="font-size: 0.85rem; color: var(--primary);">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
            </form>
        </div>
    </div>

    <!-- Main App (Hidden until login) -->
    <div id="app" class="app hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-user-graduate"></i>
                    <span>QLHS</span>
                </div>
                <button id="toggleSidebar" class="sidebar-toggle"><i class="fas fa-bars"></i></button>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
                <a href="#" class="nav-item" data-page="students"><i class="fas fa-user-graduate"></i> <span>Học sinh</span></a>
                <a href="#" class="nav-item" data-page="classes"><i class="fas fa-chalkboard-teacher"></i> <span>Lớp</span></a>
                <a href="#" class="nav-item" data-page="scores"><i class="fas fa-pencil-alt"></i> <span>Điểm</span></a>
                <a href="#" class="nav-item" data-page="attendance"><i class="fas fa-clipboard-check"></i> <span>Điểm danh</span></a>
                <a href="#" class="nav-item" data-page="rewards"><i class="fas fa-medal"></i> <span>Khen thưởng</span></a>
                <a href="#" class="nav-item" data-page="disciplines"><i class="fas fa-gavel"></i> <span>Kỷ luật</span></a>
                <a href="#" class="nav-item" data-page="files"><i class="fas fa-folder-open"></i> <span>File</span></a>
                <a href="#" class="nav-item" data-page="statistics"><i class="fas fa-chart-bar"></i> <span>Thống kê</span></a>
                <a href="#" class="nav-item" data-page="search"><i class="fas fa-search"></i> <span>Tìm kiếm</span></a>
                <a href="#" class="nav-item" data-page="settings"><i class="fas fa-cog"></i> <span>Cài đặt</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <button id="toggleSidebarMobile" class="sidebar-toggle-mobile"><i class="fas fa-bars"></i></button>
                <h2 id="pageTitle">Dashboard</h2>
                <div class="topbar-right">
                    <button id="darkModeToggle" class="btn-icon" title="Chế độ tối"><i class="fas fa-moon"></i></button>
                    <span style="color: var(--text-secondary); margin-right: 10px;">Võ Thanh Đậm</span>
                    <button id="logoutBtn" class="btn-icon" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="pageContainer" class="page-container">
                <!-- Content will be rendered here -->
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="supabase.js"></script>
    <script type="module" src="migration.js"></script>
</body>
</html>
